<div class="h-full bg-white p-5 rounded-2xl shadow-lg">
  <div class="flex flex-col h-full">
    <div class="flex justify-between items-start">
      <div>
        <h2 class="text-lg font-medium text-gray-500">{{title}}</h2>
        @if (description) {
          <p class="text-sm text-gray-400">Last 7 days</p>
        }
      </div>
    </div>

    <div>
      <h2 class="text-4xl font-bold mt-2 text-gray-900">{{ totalTasks }}</h2>
    </div>

    <div class="border-t border-gray-200 my-4"></div>

    <div class="flex items-center justify-between gap-2 mt-auto text-sm">
      <div class="text-center">
        <p class="text-gray-500 font-medium">In Progress</p>
        <p class="font-semibold">{{ inProgressTasks }}</p>
      </div>
      <div class="text-center">
        <p class="text-gray-500 font-medium">Reviewed</p>
        <p class="font-semibold">{{ reviewedTasks }}</p>
      </div>
      <div class="text-center">
        <p class="text-gray-500 font-medium">Completed</p>
        <p class="font-semibold">{{ completedTasks }}</p>
      </div>
    </div>
  </div>
</div>
