<div
  class="flex flex-col gap-2 bg-white rounded-3xl border-2 border-[#E2E8F0] p-2.5"
>
  <span
    class="font-semibold text-xs w-fit rounded-full px-2 py-1"
    [ngStyle]="{
      'background-color': priorites[0].backgroundColor,
      color: priorites[0].color,
    }"
    *ngIf="priorites.length > 0"
  >
    {{ priorites[0].text }}
  </span>

  <div>
    <h2 class="font-bold text-base text-[#1E293B]">{{ title }}</h2>
    <p class="text-[#475569] text-sm font-normal">{{ description }}</p>
  </div>

  <div class="flex items-center justify-between mt-2">
    @for (user of users; track user.name) {
      <ng-container *ngFor="let user of users; let i = index">
        <img
          [src]="user.image"
          [alt]="user.name || 'User avatar'"
          class="w-10 h-10 rounded-full border-2 border-white"
          [ngClass]="{ '-ml-3': i !== 0 }"
        />
      </ng-container>
    }
    <div class="flex items-center justify-between gap-4">
      <div class="flex items-center gap-1">
        <span class="material-icons text-[#94A3B8]">chat</span>
        <span class="text-[#1E293B] text-base font-semibold">{{
          comments.length
        }}</span>
      </div>
      <div class="flex items-center gap-1">
        <span class="material-icons text-[#94A3B8]">check_circle</span>
        <span class="text-[#1E293B] text-base font-semibold">{{
          completed
        }}</span>
      </div>
    </div>
  </div>
</div>
